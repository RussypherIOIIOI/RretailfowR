[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "retailflow"
version = "0.1.0"
requires-python = ">=3.11"
description = "A tested Databricks sales lakehouse portfolio"

[tool.setuptools.packages.find]
include = ["retailflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
